[project]
name = "causal-lens"
version = "0.1.0"
description = "Causal inference toolkit: A/B testing, Difference-in-Differences, Synthetic Control, and Uplift Modeling."
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scipy>=1.10", "statsmodels>=0.14", "scikit-learn>=1.3"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["causal_lens*"]
